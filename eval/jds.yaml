# 30 SYNTHETIC job descriptions for the agent experiment (amendment A2).
#
# Written on 2026-10-25 for this eval, before any Step 1 run. Fictional
# companies; any resemblance to real postings is generic. Not copied from any
# job board. Committed publicly so the eval set can be checked.
#
# Mix: 12 SWE, 9 AI/ML, 9 data analyst. 5 have a blocker; its key phrase is in
# "blocker" and counts as caught if a mode's blockers output contains it
# (any case). The other 25 deliberately mention no sponsorship, citizenship or
# clearance terms at all.

- id: swe-01
  category: swe
  company: Brightlane Logistics
  role: Backend Software Engineer
  blocker: null
  text: |
    Brightlane builds routing software for regional delivery fleets. We're hiring a Backend Software Engineer to work on the APIs that dispatchers and drivers use every day.

    What you'll do:
    - Design and build REST APIs in Python (FastAPI) backed by PostgreSQL.
    - Write tests with pytest and keep our CI pipeline in GitHub Actions green.
    - Improve slow queries and add indexes where the data shows they're needed.
    - Take part in code review and on-call for the services you own.

    What we're looking for:
    - Experience building web services in Python.
    - Solid SQL and an understanding of relational data modeling.
    - Familiarity with Docker and deploying to a cloud platform.
    - Clear written communication.

    Nice to have: Redis, background job queues, experience with rate limiting or idempotent APIs.

