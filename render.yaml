services:
  - type: web
    name: job-application-tracker
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Set both of these in the Render dashboard — never commit them.
      # DATABASE_URL: Supabase → Connect → Session pooler connection string.
      # (Do not use the direct connection: it is IPv6-only and Render's free
      # tier cannot reach it.)
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
