# Render service definition for the backend (the frontend runs on Vercel).
#
# Reference/IaC for the backend Docker web service. On the free plan, create it
# from the dashboard (New > Web Service, Root Directory: backend, runtime
# Docker) and set the sync: false secrets there; they are never committed.
#
# Database stays on Supabase; set DATABASE_URL to the Session pooler string.

services:
  - type: web
    name: job-tracker-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # A long random string; the Vercel frontend must send the same value as
      # BACKEND_API_KEY.
      - key: API_KEY
        sync: false
      # One LLM key is enough (Groq is free). Leave the other unset.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
