# Render Blueprint: two Docker web services (backend + frontend) on the free
# plan, built from their Dockerfiles. Create it in the dashboard with
# New > Blueprint, pointed at this repo. Secrets (sync: false) are entered
# there, never committed.
#
# Database stays on Supabase; set DATABASE_URL to the Session pooler string.

services:
  - type: web
    name: job-tracker-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # A long random string; the frontend must send the same value.
      - key: API_KEY
        sync: false
      # One LLM key is enough (Groq is free). Leave the other unset.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto

  - type: web
    name: job-tracker-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Render injects the backend's hostname here; the proxy adds https://.
      - key: BACKEND_URL
        fromService:
          type: web
          name: job-tracker-backend
          property: host
      # Must match the backend's API_KEY above.
      - key: BACKEND_API_KEY
        sync: false
