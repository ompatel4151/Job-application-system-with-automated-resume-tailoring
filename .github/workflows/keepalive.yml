# Supabase's free plan pauses a project after about a week with no activity,
# and then the backend can't start (RUNBOOK.md, section 1). Twice a week, this
# makes one trivial database query through the public backend. No secrets.
#
# GitHub turns off scheduled workflows in a repo with no commits for 60 days;
# re-enable it from the Actions tab if that happens.
name: Keep the database awake

on:
  schedule:
    - cron: "17 14 * * 1,4"  # Mondays and Thursdays, 14:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query the database through the backend
        # Render's free instance can take a minute to wake up, so retry.
        run: >
          curl --fail --silent --show-error --max-time 120
          --retry 5 --retry-delay 30 --retry-all-errors
          https://job-tracker-backend-cm7h.onrender.com/health/db
